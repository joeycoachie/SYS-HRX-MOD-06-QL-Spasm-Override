<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement OS | KIN-015 (QL & Nerve Protocol)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }
        
        .phase-content { display: none; }
        .phase-content.active { display: block; animation: fadeIn 0.3s ease-in; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .clock-display { font-family: 'Courier New', Courier, monospace; letter-spacing: 0.1em; }
        
        /* RA OVERRIDE LOGIC */
        .ra-module { display: none; }
        body.ra-active .ra-module { 
            display: block; 
            animation: fadeIn 0.3s ease-in;
        }
        .ra-toggle-btn.active {
            background-color: #1e3a8a; 
            border-color: #3b82f6;
            color: #ffffff;
        }

        /* WEEK TOGGLE STYLES */
        .week-btn {
            background-color: #050505;
            color: #71717a;
            border: 1px solid #333333;
            transition: all 0.2s ease;
        }
        .week-btn.active {
            background-color: #111111;
            color: #ffffff;
            border-color: #00e5ff;
        }
        
        /* Custom Checkbox (SYS-D022 Sharp Edges) */
        input[type="checkbox"] {
            appearance: none;
            background-color: #050505;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 1px solid #333333;
            display: grid;
            place-content: center;
            border-radius: 0;
            flex-shrink: 0; /* Prevents text from pushing into the box */
        }
        input[type="checkbox"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        input[type="checkbox"]:checked::before { transform: scale(1); }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- SIDEBAR: Navigation & Clock -->
    <aside class="w-full md:w-80 border-b md:border-b-0 md:border-r border-[#333333] bg-[#050505] p-8 flex flex-col overflow-y-auto">
        <div class="mb-8">
            <p class="text-xs tracking-widest text-[#00e5ff] font-bold uppercase mb-2">Protocol</p>
            <h1 class="text-2xl text-white">KIN-015_QL</h1>
            <p class="text-sm text-gray-400 mt-2">Nerve Impingement & QL Spasm</p>
        </div>

        <!-- WEEK TOGGLE -->
        <div class="mb-8 grid grid-cols-3 gap-2">
            <button onclick="switchWeek('week1')" id="btn-week1" class="week-btn active py-2 text-[10px] font-bold tracking-widest uppercase">Wk 1</button>
            <button onclick="switchWeek('week2')" id="btn-week2" class="week-btn py-2 text-[10px] font-bold tracking-widest uppercase">Wk 2</button>
            <button onclick="switchWeek('week3')" id="btn-week3" class="week-btn py-2 text-[10px] font-bold tracking-widest uppercase">Wk 3</button>
        </div>

        <!-- SESSION CLOCK MODULE -->
        <div class="mb-8 border border-[#333333] bg-[#111111] p-6">
            <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-4">Flow Clock</h3>
            <div id="timerDisplay" class="clock-display text-4xl text-white mb-6 text-center">00:00</div>
            <div class="flex space-x-4">
                <button id="startBtn" onclick="toggleTimer()" class="flex-1 border border-[#333333] bg-[#050505] hover:bg-[#222222] transition-colors py-2 text-sm font-semibold tracking-wide">START</button>
                <button onclick="resetTimer()" class="flex-1 border border-[#333333] bg-[#050505] hover:bg-[#222222] transition-colors py-2 text-sm font-semibold tracking-wide text-gray-500">RESET</button>
            </div>
        </div>

        <!-- GLOBAL OVERRIDES -->
        <div class="mb-8 border border-[#333333] p-6 bg-[#0a0a0a]">
            <h3 class="text-xs uppercase tracking-widest text-gray-500 mb-4">Medical Overrides</h3>
            <button id="raToggleBtn" onclick="toggleRA()" class="ra-toggle-btn w-full border border-[#333333] bg-[#111111] transition-colors py-3 text-sm font-semibold tracking-wide text-gray-400">
                [ ] RA OVERRIDE
            </button>
        </div>

        <nav class="flex-1 space-y-4" id="nav-menu">
            <button onclick="switchPhase('primer')" id="nav-primer" class="nav-btn w-full text-left p-4 border border-[#333333] bg-[#111111] hover:border-gray-500 transition-colors active-nav">
                <span class="text-xs text-gray-500 block mb-1">Preparation</span>
                <span class="font-semibold tracking-wide">1. Primer</span>
            </button>
            <button onclick="switchPhase('anchor')" id="nav-anchor" class="nav-btn w-full text-left p-4 border border-[#333333] hover:border-gray-500 transition-colors">
                <span class="text-xs text-gray-500 block mb-1">Stability</span>
                <span class="font-semibold tracking-wide">2. Anchor</span>
            </button>
            <button onclick="switchPhase('crucible')" id="nav-crucible" class="nav-btn w-full text-left p-4 border border-[#333333] hover:border-gray-500 transition-colors">
                <span class="text-xs text-gray-500 block mb-1">Pathology Focus</span>
                <span class="font-semibold tracking-wide">3. Crucible</span>
            </button>
            <button onclick="switchPhase('unwind')" id="nav-unwind" class="nav-btn w-full text-left p-4 border border-[#333333] hover:border-gray-500 transition-colors">
                <span class="text-xs text-gray-500 block mb-1">Decompression</span>
                <span class="font-semibold tracking-wide">4. Unwind</span>
            </button>
        </nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 bg-[#050505] p-8 md:p-16 overflow-y-auto" id="content-area">
        
        <!-- PHASE TEMPLATE -->
        <div id="dynamic-phase-content" class="phase-content active">
            <!-- Injected via JS -->
        </div>

    </main>

    <script>
        // DATA MATRIX: 3 Weeks x 4 Phases
        const protocolData = {
            week1: {
                primer: {
                    title: "The Primer (Spinal Baseline)",
                    sub: "Mat: Pelvic Clocks & Diaphragmatic Breath",
                    tools: "Mat",
                    steps: [
                        "Supine on mat. Knees bent.",
                        "Subtle anterior and posterior pelvic tilts to find Neutral.",
                        "Deep lateral rib breathing to disengage scalenes/neck."
                    ],
                    wolf: "Assess the resting tone of the lumbar spine. We cannot load the system until the parasympathetic state is activated and the pelvis is unlocked.",
                    shepherd: "Imagine a bowl of water resting on your pelvis. Gently tip water out the front, then out the back. Find the quiet center.",
                    safety: "Ribs flaring aggressively off the mat on the inhale, indicating severe diaphragmatic locking.",
                    raMod: "Ensure cervical spine is supported with a small pad if FHP (Forward Head Posture) strains the neck."
                },
                anchor: {
                    title: "The Anchor (Neurological Decompression)",
                    sub: "Ladder Barrel: Passive Lateral Flexion",
                    tools: "Ladder Barrel",
                    steps: [
                        "Right side facing the ceiling. Feet anchored securely on the rungs.",
                        "Deep, passive side-bend over the barrel apex.",
                        "Hold for 90 seconds. Breathe laterally into the right ribcage to expand the intercostals."
                    ],
                    wolf: "We must eccentrically lengthen the right Quadratus Lumborum before we ask the pelvis to bear weight. Gravity is the only load here.",
                    shepherd: "Melt over the barrel like warm wax. Send every breath into the right side of your ribs to stretch from the inside out.",
                    safety: "Rotating the pelvis forward or backward to fake the stretch; must stay strictly in the coronal plane.",
                    raMod: "If gripping the rung is painful, use a soft strap or forearm hook to secure the lower body."
                },
                crucible: {
                    title: "The Crucible (Sciatic Glide)",
                    sub: "Reformer: Single Leg Foot-in-Strap Dorsiflexion",
                    tools: "Reformer (1 Medium Spring)",
                    steps: [
                        "Supine on Reformer. Single strap on right foot.",
                        "Standard hamstring stretch arc.",
                        "CRITICAL ADDITION: Point the toe at the bottom of the arc. Flex the toe hard toward the shin at the very top of the arc."
                    ],
                    wolf: "This is Neural Flossing. This restores the glide to the sciatic tract without compressing the lumbar spine. Active ankle articulation drives the nerve glide.",
                    shepherd: "Floss the nerve. Draw a massive arc with your heel, then slice through the air with your toes.",
                    safety: "Lifting the sacrum/tailbone off the mat during the upward arc (breaking the lumbopelvic anchor).",
                    raMod: "Substitute single leg strap for bilateral straps if unilateral loading triggers SI joint instability."
                },
                unwind: {
                    title: "The Unwind (Passive Traction)",
                    sub: "Cadillac: Supported Supine Leg Springs",
                    tools: "Cadillac (Light Leg Springs)",
                    steps: [
                        "Supine, feet in light leg springs.",
                        "Allow the springs to gently traction the femurs out of the acetabulum.",
                        "Micro-bend knees to protect the joint capsule."
                    ],
                    wolf: "Total structural offloading. The hardware assumes the weight of the limbs to allow the QL to completely switch off.",
                    shepherd: "Let the springs pull the weight of the world out of your hips.",
                    safety: "Forcing the knees perfectly straight if the hamstrings begin to violently shake/spasm.",
                    raMod: "None needed. Passive supine traction is S-Rank safe for RA."
                }
            },
            week2: {
                primer: {
                    title: "The Primer (Anti-Rotation)",
                    sub: "Mat: Quadruped Bird-Dog",
                    tools: "Mat",
                    steps: [
                        "Quadruped position. Knees under hips, hands under shoulders.",
                        "Extend opposite arm and leg simultaneously.",
                        "Hold for 3 seconds. Focus on resisting rotational shear."
                    ],
                    wolf: "Engaging the oblique slings across the posterior chain to ensure they can stabilize the pelvis before vertical loading.",
                    shepherd: "Balance a hot cup of coffee on your lower back. Do not spill a drop as your limbs move.",
                    safety: "Massive lateral weight shift or lumbar sagging (hyper-extension).",
                    raMod: "Drop to forearms to protect wrists. Tap legs back only (no arm lift)."
                },
                anchor: {
                    title: "The Anchor (Active Elongation)",
                    sub: "Reformer: Eve's Lunge (Supported)",
                    tools: "Reformer (Heavy Springs)",
                    steps: [
                        "Kneeling on carriage, front foot on floor/bar.",
                        "Deep, supported lunge. Active glute engagement on the pushing leg.",
                        "Maintain square ASIS headlights."
                    ],
                    wolf: "Active stretching of the hip flexor complex to prevent it from pulling the pelvis into an anterior tilt.",
                    shepherd: "Drop your hips straight down an elevator shaft. Keep your chest proud to the wall.",
                    safety: "Dumping into the lumbar spine (arching the back) to simulate a deeper hip stretch.",
                    raMod: "Use a padded box under the back knee if patella pressure causes pain."
                },
                crucible: {
                    title: "The Crucible (Isometric Anchoring)",
                    sub: "Wunda Chair: Contralateral Lateral Step-Downs",
                    tools: "Wunda Chair (1 Heavy Spring)",
                    steps: [
                        "Left foot securely on top of the chair. Right foot hovering off the side.",
                        "Slowly lower the right foot toward the floor by bending the left knee.",
                        "Drive up explosively, maintaining pelvic level."
                    ],
                    wolf: "The Iron Skeleton Mandate: The pelvis must remain perfectly level. If the right hip hikes on the way up, the left Gluteus Medius is failing to anchor.",
                    shepherd: "Your waistbands stay perfectly horizontal. Push the chair into the floor to grow taller.",
                    safety: "Right hip hiking aggressively during the concentric phase (upward drive).",
                    raMod: "Hold a dowel or wall for balance to reduce neuromuscular overload. Reduce depth of step-down."
                },
                unwind: {
                    title: "The Unwind (Lateral Integration)",
                    sub: "Reformer: Box Mermaid",
                    tools: "Reformer (1 Light Spring)",
                    steps: [
                        "Sitting on Short Box. Hand on footbar.",
                        "Push carriage out, moving into deep lateral flexion.",
                        "Keep opposite sit-bone glued to the box."
                    ],
                    wolf: "Actively stretching the lateral line while the core manages the return phase. Re-integrating the QL into movement.",
                    shepherd: "Paint a massive rainbow over your head. Keep your hips heavy like lead weights.",
                    safety: "Lifting the off-side sit-bone to artificially increase range of motion.",
                    raMod: "Substitute with Mat Mermaid to eliminate the pushing/wrist load of the footbar."
                }
            },
            week3: {
                primer: {
                    title: "The Primer (Bilateral Load)",
                    sub: "Reformer: Parallel Footwork",
                    tools: "Reformer (3 Red 1 Blue)",
                    steps: [
                        "Parallel arches and heels.",
                        "Focus entirely on symmetric load distribution.",
                        "Track patella exactly over 2nd toe."
                    ],
                    wolf: "Assessing if the QL release from Weeks 1 & 2 translates to symmetrical bilateral pressing power.",
                    shepherd: "Push the wall away with perfectly even force. Ride train tracks.",
                    safety: "One knee caving in (valgus) or hips shifting laterally under heavy spring load.",
                    raMod: "Use lighter springs (2 Red) to reduce joint compression through the knee/hip complex."
                },
                anchor: {
                    title: "The Anchor (Dynamic Stability)",
                    sub: "Chair: Forward Step-Ups",
                    tools: "Wunda Chair (1 Heavy 1 Light)",
                    steps: [
                        "Facing chair. Right foot on pedal, left foot on top.",
                        "Shift weight forward and drive up to standing on the chair.",
                        "Slow, 4-second eccentric descent."
                    ],
                    wolf: "Dynamic vertical load. Forcing the deep longitudinal line to fire sequentially without QL spasms.",
                    shepherd: "Control the descent. Land as quietly as a ninja.",
                    safety: "Crashing down onto the pedal, indicating massive eccentric failure of the glute max.",
                    raMod: "Substitute with floor-based dynamic split squats holding a wall for support."
                },
                crucible: {
                    title: "The Crucible (Dynamic Integration)",
                    sub: "Reformer: Jumpboard (Light Spring)",
                    tools: "Reformer (1 Red Spring) + Jumpboard",
                    steps: [
                        "Light spring tension to prolong air time.",
                        "Parallel jumps, transitioning to alternating single-leg bounds.",
                        "Focus on mid-foot strike and rapid dorsiflexion recovery in the air."
                    ],
                    wolf: "Reintroducing impact safely. The light spring forces the core to decelerate the carriage, testing the nerve glide mechanics under plyometric stress.",
                    shepherd: "Roll through the foot like a tire. Toe, ball, heel. Silent landings.",
                    safety: "Landing flat-footed or locking the knees mid-air, driving shockwaves into the lumbar spine.",
                    raMod: "STRICTLY CONTRAINDICATED. Remove Jumpboard immediately. Perform rapid, unweighted footwork instead."
                },
                unwind: {
                    title: "The Unwind (Global Release)",
                    sub: "Cadillac: Push-Through Forward Flexion",
                    tools: "Cadillac (Top Sprung PT Bar)",
                    steps: [
                        "Seated facing the tower. Hands on PT bar.",
                        "Articulate spine forward, letting bar pull shoulders forward.",
                        "Stack back up bone by bone."
                    ],
                    wolf: "Global decompression of the superficial back line. Restoring final parasympathetic tone.",
                    shepherd: "Dive over a massive beach ball, letting the bar do the reaching for you.",
                    safety: "Hinging at the hips with a flat back instead of curving the spine.",
                    raMod: "Use flat palms on the bar instead of wrapping fingers if grip is inflamed."
                }
            }
        };

        let currentWeek = 'week1';
        let currentPhase = 'primer';

        function switchWeek(weekKey) {
            currentWeek = weekKey;
            
            // Update Week Buttons
            document.querySelectorAll('.week-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + weekKey).classList.add('active');
            
            // Re-render current phase
            renderPhaseContent();
        }

        function switchPhase(phaseKey) {
            currentPhase = phaseKey;
            
            // Update Nav Buttons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-[#111111]'));
            document.getElementById('nav-' + phaseKey).classList.add('bg-[#111111]');
            
            // Render content
            renderPhaseContent();
        }

        function renderPhaseContent() {
            const data = protocolData[currentWeek][currentPhase];
            const container = document.getElementById('dynamic-phase-content');
            
            let stepsHtml = '';
            data.steps.forEach(step => {
                stepsHtml += `
                    <li class="flex items-start gap-4">
                        <input type="checkbox" class="mt-1 shrink-0 cursor-pointer">
                        <span class="text-gray-300 leading-relaxed block">${step}</span>
                    </li>
                `;
            });

            container.innerHTML = `
                <div class="flex justify-between items-start mb-12">
                    <div>
                        <h2 class="text-4xl mb-2">${data.title}</h2>
                        <p class="text-gray-400 uppercase tracking-widest text-sm">${data.sub}</p>
                    </div>
                    <div class="border border-[#333333] px-6 py-3 bg-[#111111] text-right">
                        <span class="text-xs text-gray-500 uppercase tracking-widest block mb-1">Apparatus</span>
                        <span class="font-semibold text-white">${data.tools}</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                    <div class="bg-[#111111] border border-[#333333] p-8">
                        <h3 class="text-xl mb-6 text-gray-300">Execution Steps</h3>
                        <ul class="space-y-4">
                            ${stepsHtml}
                        </ul>
                    </div>
                    <div class="space-y-8">
                        <div class="bg-[#111111] border border-[#333333] p-8">
                            <h3 class="text-sm uppercase tracking-widest text-[#00e5ff] mb-2 font-bold">The Wolf Cue (Biomechanical)</h3>
                            <p class="text-gray-200 leading-relaxed">${data.wolf}</p>
                        </div>
                        <div class="bg-[#111111] border border-[#333333] p-8">
                            <h3 class="text-sm uppercase tracking-widest text-gray-500 mb-2">The Shepherd Cue (Imagery)</h3>
                            <p class="text-gray-200 italic font-light">"${data.shepherd}"</p>
                        </div>
                    </div>
                </div>

                <div class="border border-red-900/50 bg-[#110505] p-8 border-l-4 border-l-red-500">
                    <h3 class="text-red-500 font-bold uppercase tracking-widest text-sm mb-2">Safety Gate (QA Fail)</h3>
                    <p class="text-red-200 text-lg">${data.safety}</p>
                </div>

                <div class="ra-module border border-[#1e3a8a] bg-[#0a0f1c] p-8 mt-8 border-l-4 border-l-[#3b82f6]">
                    <h3 class="text-[#3b82f6] font-bold uppercase tracking-widest text-sm mb-4">RA OVERRIDE: ${data.title.split(' ')[1]}</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <span class="text-xs text-gray-400 uppercase tracking-widest block mb-1">Execution Mod</span>
                            <p class="text-gray-200 text-sm">${data.raMod}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // RA Override Toggle Logic
        let isRaActive = false;
        function toggleRA() {
            const btn = document.getElementById('raToggleBtn');
            isRaActive = !isRaActive;
            
            if(isRaActive) {
                document.body.classList.add('ra-active');
                btn.classList.add('active');
                btn.innerText = '[X] RA OVERRIDE ACTIVE';
            } else {
                document.body.classList.remove('ra-active');
                btn.classList.remove('active');
                btn.innerText = '[ ] RA OVERRIDE';
            }
        }

        // Timer Logic
        let timerInterval;
        let seconds = 0;
        let isRunning = false;

        function updateDisplay() {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('startBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                btn.innerText = 'RESUME';
                btn.classList.replace('text-red-500', 'text-white');
            } else {
                timerInterval = setInterval(() => {
                    seconds++;
                    updateDisplay();
                }, 1000);
                btn.innerText = 'PAUSE';
                btn.classList.add('text-red-500');
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            isRunning = false;
            updateDisplay();
            const btn = document.getElementById('startBtn');
            btn.innerText = 'START';
            btn.classList.remove('text-red-500');
            btn.classList.add('text-white');
        }

        // Init
        renderPhaseContent();
    </script>
</body>
</html>
